name: Release container

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - requirements-test.txt
      - start.sh
      - config.py
      - handler.py
      - pdf_processor.py
      - url_security.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: silver3926/paddleocr-vl-runpod
  IMAGE_SHA_TAG: ${{ github.sha }}
  IMAGE_CANDIDATE_TAG: candidate-${{ github.sha }}

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build candidate image
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        id: metadata
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan candidate image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_CANDIDATE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH

      - name: Promote scanned image to production tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CANDIDATE_TAG: ${{ env.IMAGE_CANDIDATE_TAG }}
          SHA_TAG: ${{ env.IMAGE_SHA_TAG }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            "${IMAGE}:${CANDIDATE_TAG}"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${CANDIDATE_TAG}"
