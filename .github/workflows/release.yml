name: Release container

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - requirements-test.txt
      - start.sh
      - config.py
      - handler.py
      - pdf_processor.py
      - url_security.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: silver3926/paddleocr-vl-runpod
  IMAGE_SHA_TAG: ${{ github.sha }}
  IMAGE_CANDIDATE_TAG: candidate-${{ github.sha }}

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build candidate image
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        id: metadata
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          progress: plain
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Diagnostic mode: disable BuildKit attestations temporarily so the
          # Trivy result can be compared against a filesystem-only image.
          provenance: false
          sbom: false

      # With attestations disabled, resolve the linux/amd64 image digest and
      # scan that exact image rather than a mutable tag.
      - name: Resolve platform manifest digest
        id: resolve
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CANDIDATE_TAG: ${{ env.IMAGE_CANDIDATE_TAG }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE}:${CANDIDATE_TAG}"
          RAW="$(docker buildx imagetools inspect "${REF}" --raw)"

          if jq -e '.manifests' >/dev/null <<<"${RAW}"; then
            DIGEST="$(jq -r '(.manifests // [])
              | map(select(.platform.os == "linux" and .platform.architecture == "amd64"))
              | first
              | .digest // empty' <<<"${RAW}")"
          else
            DIGEST="${BUILD_DIGEST}"
          fi

          if [ -z "${DIGEST}" ]; then
            echo "::error::Tidak dapat menemukan digest manifest linux/amd64 untuk ${REF}"
            echo "Raw manifest:"
            echo "${RAW}"
            exit 1
          fi

          echo "Scan target: ${IMAGE}@${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      # Diagnostic gate: compare this filesystem-only scan with the previous
      # scan that included BuildKit SBOM/provenance attestations.
      - name: Scan candidate image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.resolve.outputs.digest }}
          format: json
          output: trivy-image-report.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH

      - name: Summarize Trivy findings
        if: always()
        run: |
          set -euo pipefail

          if [ ! -s trivy-image-report.json ]; then
            echo "Laporan Trivy tidak tersedia."
            exit 0
          fi

          echo "=== Ringkasan ==="
          jq -r '
            [.Results[]?.Vulnerabilities[]?] as $v
            | "total=\($v | length) critical=\([$v[] | select(.Severity == "CRITICAL")] | length) high=\([$v[] | select(.Severity == "HIGH")] | length)"
          ' trivy-image-report.json || true

          echo "=== Temuan per target ==="
          jq -r '
            .Results[]?
            | select((.Vulnerabilities // []) | length > 0)
            | "\(.Target) [\(.Type)]",
              ((.Vulnerabilities // [])[]
               | "  - \(.VulnerabilityID) \(.Severity) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "-")")
          ' trivy-image-report.json || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Promote scanned image to production tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CANDIDATE_TAG: ${{ env.IMAGE_CANDIDATE_TAG }}
          SHA_TAG: ${{ env.IMAGE_SHA_TAG }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            "${IMAGE}:${CANDIDATE_TAG}"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${CANDIDATE_TAG}"
