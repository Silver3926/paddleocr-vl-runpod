name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Ruff
        run: python -m ruff check . --select E4,E7,E9,F

      - name: Pytest
        run: python -m pytest -q

      - name: Bandit production source
        run: >
          python -m bandit
          -r config.py handler.py pdf_processor.py url_security.py

      - name: pip-audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off
